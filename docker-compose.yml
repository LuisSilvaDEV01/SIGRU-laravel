services:
  mysql:
    build:
      context: .
      dockerfile: docker/mysql/Dockerfile
    container_name: sigru-mysql
    environment:
      MYSQL_ROOT_PASSWORD: sigru
      MYSQL_DATABASE: sigru
      TZ: America/Sao_Paulo
    ports:
      - "3307:3306"
    volumes:
      - sigru_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-psigru"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sigru-app
    ports:
      - "8000:8000"
    environment:
      APP_NAME: SIGRU
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: sigru
      DB_USERNAME: root
      DB_PASSWORD: sigru
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  sigru_mysql_data:
